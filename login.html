<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Donnuts &amp; Breack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive&family=Hammersmith+One&family=Holtwood+One+SC&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <button class="alternar-tema" type="button" title="Ativar modo escuro">&#9790;</button>
    <main id="login">
        <a href="index.html" class="mascote-login">
            <span class="recorte-mascote">
                <img src="images/2005-36-imgDesignSemNome1RemovebgPreview3.png" alt="Mascote Donnuts">
            </span>
        </a>
        <section class="acesso">
            <div class="marca">
                <h1>Donnuts</h1>
                <p>
                    <span>&amp;</span>
                    BREACK
                </p>
            </div>
            <form id="form-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                </div>
                <p class="cadastre">
                    Não possui uma conta?
                    <a href="cadastro.html">Cadastre-se</a>
                </p>
                <button class="botao">Entrar</button>
                <p role="status" id="aviso"></p>
            </form>
        </section>
    </main>
</body>
</html>
