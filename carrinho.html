<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Carrinho | Donnuts &amp; Breack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive&family=Hammersmith+One&family=Holtwood+One+SC&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <button class="alternar-tema" type="button" title="Ativar modo escuro">&#9790;</button>
    <header>
        <details class="menu">
            <summary title="Abrir menu">
                <img src="images/menu.svg" alt="Menu">
            </summary>
            <nav>
                <a href="carrinho.html">
                    <img src="images/1-2-imgBasketShoppingSolidFull1.svg" alt="Carrinho">
                </a>
                <a href="cardapio.html#busca">
                    <img src="images/1-2-imgMagnifyingGlassSolidFull11.svg" alt="Buscar sabores">
                </a>
                <a class="conta" href="login.html">Login</a>
            </nav>
        </details>
    </header>
    <a class="voltar" href="cardapio.html">
        <img src="images/2007-2-imgArrowLeftLongSolidFull1.svg" alt="">
    </a>
    <main id="carrinho">
        <h1>Carrinho</h1>
        <h2>De Compras</h2>
        <div class="checkout">
            <section id="itens-carrinho">
            </section>
            <aside class="resumo">
                <h3>Resumo do seu pedido</h3>
                <p id="total">Valor Total: R$24</p>
                <p class="endereco-pedido">*Endereço*</p>
                <button class="botao" id="pagamento">Pagamento</button>
                <p role="status" id="aviso"></p>
            </aside>
        </div>
    </main>

</html>
